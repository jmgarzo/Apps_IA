version: "3.9"

name: tmdb-deepseek-test

services:
  ollama-test:
    image: ollama/ollama:latest
    container_name: ollama_test
    restart: unless-stopped
    ports:
      - "11435:11434"  # Puerto diferente para evitar conflictos
    volumes:
      - ollama-test:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
      # Forzar uso de GPU
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-test-init:
    image: ollama/ollama:latest
    container_name: ollama-test-init
    depends_on:
      - ollama-test
    entrypoint: ["sh","-lc"]
    command: "sleep 10; ollama pull llama3.2:3b || true"
    restart: "no"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-test:
